# Integracion continua: ningun cambio llega a main sin pasar lint, formato,
# tipos, pruebas con umbral de cobertura (80 %) y build de todos los paquetes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # La version de pnpm se toma de "packageManager" en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      # vitest falla si la cobertura baja de los umbrales de vitest.config.ts.
      - name: Pruebas con cobertura
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Publicar reporte de cobertura
        if: matrix.node == 22 && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
